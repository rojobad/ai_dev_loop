version: 2

project:
  name: ai-dev-loop

cursor:
  runtime: sdk-local
  sdk_version: 1.0.37
  model: grok-4.7
  parameters:
    context: 256k
    reasoning_effort: high
    fast: false
  credential_ref: cursor-default
  setting_sources:
    - project
  sandbox: disabled

codex:
  command: codex
  review_skill: review-staged-ai-dev-loop-execution
  sandbox: workspace-write

workflow:
  max_review_iterations: 7
  require_clean_worktree: true
  stage_mode: all
  cursor_timeout_minutes: 90
  codex_timeout_minutes: 90

prompt:
  directory: archive/implementation-history/plans
  filename_template: prompt_{plan_stem}.txt
